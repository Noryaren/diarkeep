; Contoh pengaturan ramah server kecil (RAM 2 GB).
; Tempel di /etc/php/8.5/fpm/pool.d/www.conf atau pool khusus DiarKeep,
; lalu jalankan: sudo systemctl reload php8.5-fpm
;
; Catatan: file ini berbagi pool dengan situs lain. Turunkan angka jika
; masih ada situs PHP lain di server yang sama.

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 300

php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 8M
php_admin_value[max_execution_time] = 60
php_admin_value[max_input_time] = 60

; DiarKeep membaca kredensial dari config/config.php, jadi tidak perlu
; mengubah clear_env. Jangan gunakan env untuk password produksi.
